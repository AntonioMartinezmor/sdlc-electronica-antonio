services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sensorhub
      POSTGRES_PASSWORD: sensorhub_pass
      POSTGRES_DB: sensorhub

    ports: 
      - "5432:5432"

    volumes: 
      - postgres_data:/var/lib/postgresql/data

    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U sensorhub"]
      interval: 5s
      timeout: 5s
      retries: 5


  api: 
    build: . 
    ports: 
      - "8000:8000"
    environment: 
     DATABASE_URL: postgresql://sensorhub:sensorhub_pass@db:5432/sensorhub
    depends_on:
      db: 
        condition: service_healthy
volumes:
  postgres_data:
