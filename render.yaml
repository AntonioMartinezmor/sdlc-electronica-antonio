services: 
  - type: web 
    name: sensorhub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free 
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sensorhub-db
          property: connectionString

databases:
  - name: sensorhub-db
    databaseName: sensorhub
    user: sensorhub
    plan: free 
    